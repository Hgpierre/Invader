<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Invader Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Invader Radar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f2f2f2;--blue:#3d6bff;--dim:#777;--line:#fff;--font:'Press Start 2P','Courier New',monospace}
*{box-sizing:border-box}
html,body{margin:0;position:fixed;inset:0;width:100%;background:var(--bg);color:var(--fg);font:10px/1.5 var(--font);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:2px solid var(--line)}
header b{color:var(--blue);font-weight:normal;font-size:12px}
#map{flex:1;min-height:0;background:#000}
.leaflet-tile-pane{filter:grayscale(1) invert(1) contrast(.85) brightness(.9)}
.leaflet-container{font-family:var(--font)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#000;color:var(--fg);border:2px solid var(--line);border-radius:0}
.leaflet-popup-content{font-size:9px;margin:10px;max-width:180px;word-wrap:break-word}
.leaflet-popup-close-button{color:#fff!important}
.inv{width:22px;height:16px}.inv svg{width:22px;height:16px;display:block;shape-rendering:crispEdges}
.inv.done{opacity:.35;filter:grayscale(1)}
.me{width:14px;height:14px;background:#fff;border:3px solid var(--blue);border-radius:50%}
#panel{border-top:2px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:120px 1fr;gap:10px}
canvas{width:120px;height:120px;border:2px solid var(--line)}
#info{display:flex;flex-direction:column;gap:6px;min-width:0}
#dist{font-size:16px;color:var(--blue)}
#nm{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sum{font-size:8px;color:var(--dim)}
.row{display:flex;gap:6px;flex-wrap:wrap}
button,select{font:9px var(--font);background:#000;color:var(--fg);border:2px solid var(--line);padding:7px 6px;border-radius:0}
button:active{background:var(--blue)}
button.on{background:#fff;color:#000}
#start{position:fixed;inset:0;z-index:2000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#start h1{font-size:18px;font-weight:normal;color:var(--blue);margin:0}
#start p{font-size:9px;line-height:1.8;max-width:300px;margin:0}
#start button{font-size:12px;padding:12px 18px}
#banner{position:fixed;top:calc(env(safe-area-inset-top) + 44px);left:8px;right:8px;z-index:2500;background:var(--blue);color:#fff;border:2px solid #fff;padding:10px;display:none;font-size:10px;text-align:center}
#dest{display:flex;gap:6px;padding:6px 10px;border-bottom:2px solid var(--line)}
#q{flex:1;min-width:0;font:16px var(--font);background:#000;color:#fff;border:2px solid #fff;padding:6px;border-radius:0}
#vars button{font-size:8px;padding:6px 5px}
#radar{cursor:pointer}
#fs{position:fixed;inset:0;z-index:1800;background:#000;display:none;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top)}
#fsbar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:2px solid var(--line)}
#fsbar b{color:var(--blue);font-weight:normal;font-size:12px}
#fsr{margin-top:8px;touch-action:manipulation}
#fsinfo{width:100%;flex:1;overflow:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));font-size:9px;line-height:1.8;display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line);margin-top:8px}
#fsinfo .big{font-size:18px;color:var(--blue)}
#fsinfo .dim{color:var(--dim)}
.stop{width:12px;height:12px;background:var(--blue);border:2px solid #fff}
</style>
</head>
<body>
<div id="app">
  <header><b>INVADER RADAR</b><span id="count">...</span></header>
  <div id="dest"><input id="q" placeholder="Destination..." enterkeyhint="go" autocomplete="off"><button id="go2">GO</button></div>
  <div id="map"></div>
  <div id="panel">
    <canvas id="radar" width="240" height="240"></canvas>
    <div id="info">
      <div id="dist">--</div>
      <div id="nm">Recherche du GPS...</div>
      <div id="sum"></div>
      <div class="row" id="vars"></div>
      <div class="row">
        <select id="len"><option value="1.5">1,5 km</option><option value="3" selected>3 km</option><option value="5">5 km</option><option value="8">8 km</option></select>
        <button id="plan">ITINÉRAIRE</button>
        <button id="ctr" class="on">SUIVRE</button>
        <button id="ov">VUE TRAJET</button>
        <button id="alert" class="on">ALERTE 50m</button>
        <button id="hide">MASQUER FLASHÉS</button>
        <button id="list">LISTE</button>
      </div>
    </div>
  </div>
</div>
<div id="fs">
  <div id="fsbar"><b>RADAR</b><button id="fsx">FERMER</button></div>
  <canvas id="fsr"></canvas>
  <div id="fsinfo"><span class="dim">Touche un carré bleu pour voir l'invader.</span></div>
</div>
<div id="banner"></div>
<div id="start">
  <h1>INVADER RADAR</h1>
  <p>Trouve les Space Invaders pendant tes balades. Autorise la position, la boussole et les notifications, puis garde l'écran allumé.</p>
  <button id="go">&gt; START</button>
  <p id="err" style="color:#ff6b6b"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s), R=6371000, rad=x=>x*Math.PI/180;
const dist=(a,b)=>{const h=Math.sin(rad(b[0]-a[0])/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(rad(b[1]-a[1])/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const bearing=(a,b)=>{const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0])),x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return(Math.atan2(y,x)*180/Math.PI+360)%360};
const fmt=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(2).replace('.',',')+' km';
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

// ---------- Mise en page : suit la zone réellement visible (clavier, barres Safari) ----------
function fit(){
  const v=window.visualViewport,app=$('#app');
  app.style.height=(v?v.height:innerHeight)+'px';
  app.style.top=(v?v.offsetTop:0)+'px';
  scrollTo(0,0);map&&map.invalidateSize();
}
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));
document.addEventListener('focusout',()=>setTimeout(fit,100));
addEventListener('scroll',()=>scrollTo(0,0));

// ---------- Données ----------
let pts=[], markers={}, flashed=new Set(store.get('flashed',[])), me=null, heading=null, swReg=null;
const ICON='00100000100,00010001000,00111111100,01101110110,11111111111,10111111101,10100000101,00011011000';
const svg=c=>'<svg viewBox="0 0 11 8">'+ICON.split(',').map((r,y)=>[...r].map((v,x)=>v=='1'?`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`:'').join('')).join('')+'</svg>';
const flat=d=>d.layers?d.layers.flatMap(flat):(d.features||[]);

const map=L.map('map',{zoomControl:false}).setView([48.8566,2.3522],15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const routeLayer=L.layerGroup().addTo(map);
fit();

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function popup(p){
  const el=document.createElement('div');
  el.innerHTML=`<b>${esc(p.name)}</b><br>${esc(p.desc).slice(0,160)}<br><br>`;
  const b=document.createElement('button');
  const lab=()=>b.textContent=flashed.has(p.id)?'ANNULER FLASH':'FLASHÉ !';lab();
  b.onclick=()=>{flashed.has(p.id)?flashed.delete(p.id):flashed.add(p.id);store.set('flashed',[...flashed]);style(p);lab();count();update();};
  el.appendChild(b);return el;
}
let hideDone=store.get('hide',false);
const style=p=>{const m=markers[p.id],f=flashed.has(p.id);
  m.setIcon(L.divIcon({className:'inv'+(f?' done':''),html:svg(f?'#999':'#3d6bff'),iconSize:[22,16]}));
  if(f&&hideDone)m.remove();else if(!map.hasLayer(m))m.addTo(map)};
const count=()=>$('#count').textContent=`${flashed.size}/${pts.length} FLASHÉS`;

fetch('invaders.geojson').then(r=>r.json()).then(d=>{
  flat(d).forEach((f,i)=>{
    if(!f.geometry||f.geometry.type!=='Point')return;
    const [lon,lat]=f.geometry.coordinates, pr=f.properties||{};
    const p={id:(pr.name||'i'+i)+'@'+lat.toFixed(5)+','+lon.toFixed(5),name:pr.name||'Invader',desc:pr.description||'',ll:[lat,lon]};
    pts.push(p);
    markers[p.id]=L.marker(p.ll).bindPopup(()=>popup(p));style(p);
  });
  count();update();
}).catch(()=>{$('#count').textContent='DONNÉES ?';$('#nm').textContent='invaders.geojson introuvable'});

// ---------- Position, radar, alertes ----------
let follow=false, routeBounds=null;
const FOLLOW_M=300; // côté de la vue en mètres (300 = ~150 m autour de toi)
function setFollowBtn(){$('#ctr').classList.toggle('on',follow)}
function enterFollow(){if(!me)return;follow=true;setFollowBtn();map.setView(me,map.getBoundsZoom(L.latLng(me).toBounds(FOLLOW_M)))}
map.on('dragstart',()=>{follow=false;setFollowBtn()});
let alertM=50, alerted=new Set(store.get('alerted',[])), alertOn=true, first=true;
function nearest(){let b=null,bd=1e12;if(!me)return null;for(const p of pts){if(flashed.has(p.id))continue;const d=dist(me,p.ll);if(d<bd){bd=d;b=p}}return b&&{p:b,d:bd}}
function update(){
  const n=nearest();
  if(!n){$('#dist').textContent='--';return}
  $('#dist').textContent=fmt(n.d);$('#nm').textContent=n.p.name;
  if(alertOn&&n.d<=alertM&&!alerted.has(n.p.id)){alerted.add(n.p.id);store.set('alerted',[...alerted]);notify(n.p,n.d)}
}
function onPos(pos){
  me=[pos.coords.latitude,pos.coords.longitude];
  if(!window.meM)window.meM=L.marker(me,{icon:L.divIcon({className:'me',iconSize:[14,14]}),zIndexOffset:999}).addTo(map);else meM.setLatLng(me);
  if(first){enterFollow();first=false}else if(follow)map.panTo(me);
  update();
}
let angle=0;
function draw(){
  const c=$('#radar'),x=c.getContext('2d'),W=240,r=W/2-8;x.clearRect(0,0,W,W);x.fillStyle='#000';x.fillRect(0,0,W,W);
  x.strokeStyle='#444';x.lineWidth=2;[1,.66,.33].forEach(k=>{x.beginPath();x.arc(W/2,W/2,r*k,0,7);x.stroke()});
  x.beginPath();x.moveTo(W/2,8);x.lineTo(W/2,W-8);x.moveTo(8,W/2);x.lineTo(W-8,W/2);x.stroke();
  angle+=.04;x.strokeStyle='#3d6bff';x.beginPath();x.moveTo(W/2,W/2);x.lineTo(W/2+r*Math.sin(angle),W/2-r*Math.cos(angle));x.stroke();
  x.fillStyle='#fff';x.font='16px monospace';x.fillText(heading==null?'N':'↑',W/2-5,20);
  const n=nearest();
  if(n){const a=rad(bearing(me,n.p.ll)-(heading||0)),k=Math.min(n.d/300,1)*r;
    const bx=W/2+k*Math.sin(a),by=W/2-k*Math.cos(a);
    x.fillStyle='#3d6bff';x.fillRect(bx-9,by-9,18,18);x.fillStyle='#fff';x.fillRect(bx-4,by-4,8,8);
    x.strokeStyle='#fff';x.beginPath();x.moveTo(W/2,W/2);x.lineTo(W/2+30*Math.sin(a),W/2-30*Math.cos(a));x.stroke();}
  requestAnimationFrame(draw);
}
draw();

function beep(){try{const a=new (window.AudioContext||webkitAudioContext)(),o=a.createOscillator();o.type='square';o.connect(a.destination);
  [880,660,880].forEach((f,i)=>o.frequency.setValueAtTime(f,a.currentTime+i*.12));o.start();o.stop(a.currentTime+.4)}catch{}}
function notify(p,d){
  const t=`INVADER À ${Math.round(d)} m : ${p.name}`;
  beep();navigator.vibrate&&navigator.vibrate([200,100,200]);
  const b=$('#banner');b.textContent='👾 '+t;b.style.display='block';setTimeout(()=>b.style.display='none',6000);
  if('Notification' in window&&Notification.permission==='granted'&&swReg)swReg.showNotification('Space Invader !',{body:t,tag:p.id});
}

// ---------- Itinéraires (insertion la moins coûteuse + 2-opt) ----------
const K=1.25; // coefficient "rues" appliqué à la distance à vol d'oiseau
const D=(a,b)=>dist(a,b)*K, tot=r=>r.slice(1).reduce((t,n,i)=>t+D(r[i].ll,n.ll),0);
function build(s,e,budget){ // départ s, arrivée e (boucle si s=e), longueur max budget (m)
  let route=[{ll:s},{ll:e}], len=D(s,e);
  const left=pts.filter(p=>!flashed.has(p.id)&&D(s,p.ll)+D(p.ll,e)<=budget);
  while(left.length&&route.length<25){
    let best=-1,bi=0,bc=1e12;
    left.forEach((p,j)=>{for(let i=0;i<route.length-1;i++){const c=D(route[i].ll,p.ll)+D(p.ll,route[i+1].ll)-D(route[i].ll,route[i+1].ll);if(c<bc){bc=c;best=j;bi=i}}});
    if(len+bc>budget)break;
    route.splice(bi+1,0,{ll:left[best].ll,p:left[best]});len+=bc;left.splice(best,1);
  }
  let imp=true;while(imp){imp=false;for(let i=1;i<route.length-2;i++)for(let j=i+1;j<route.length-1;j++){
    const c=route.slice(0,i).concat(route.slice(i,j+1).reverse(),route.slice(j+1));
    if(tot(c)<tot(route)-1){route=c;imp=true}}}
  return{route,stops:route.filter(n=>n.p),meters:tot(route)};
}
const info=(n,m,min)=>`${n} invaders · ${(m/1000).toFixed(1).replace('.',',')} km · ~${Math.round(min)} min`;
let showId=0;
function drawRoute(r,geo){ // tracé = contour blanc + ligne bleue, puis étapes par-dessus
  routeLayer.clearLayers();
  if(geo){L.geoJSON(geo,{style:{color:'#fff',weight:10}}).addTo(routeLayer);L.geoJSON(geo,{style:{color:'#3d6bff',weight:5}}).addTo(routeLayer)}
  else{const c=r.route.map(n=>n.ll);L.polyline(c,{color:'#fff',weight:9}).addTo(routeLayer);L.polyline(c,{color:'#3d6bff',weight:4,dashArray:'6 6'}).addTo(routeLayer)}
  r.stops.forEach(n=>L.marker(n.ll,{icon:L.divIcon({className:'stop',iconSize:[12,12]}),interactive:false}).addTo(routeLayer));
  L.circleMarker(r.route[r.route.length-1].ll,{radius:8,color:'#fff',fillColor:'#000',fillOpacity:1,weight:3}).addTo(routeLayer);
}
async function show(r){
  const id=++showId;routeLayer.clearLayers();
  if(!r.stops.length){$('#sum').textContent='Aucun invader sur ce trajet';return}
  drawRoute(r);routeBounds=L.latLngBounds(r.route.map(n=>n.ll));
  $('#sum').textContent=info(r.stops.length,r.meters,r.meters/1000*12);
  me?enterFollow():map.fitBounds(routeBounds,{padding:[30,30]});
  try{ // tracé piéton réel (service gratuit OSM, optionnel)
    const c=r.route.map(n=>n.ll[1]+','+n.ll[0]).join(';');
    const j=await (await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${c}?overview=full&geometries=geojson`)).json();
    if(id===showId&&j.routes&&j.routes[0]){drawRoute(r,j.routes[0].geometry);
      routeBounds=L.geoJSON(j.routes[0].geometry).getBounds();
      $('#sum').textContent=info(r.stops.length,j.routes[0].distance,j.routes[0].duration/60);}
  }catch{}
}
const start=()=>me||[map.getCenter().lat,map.getCenter().lng];
function plan(){ // balade en boucle
  $('#vars').innerHTML='';const s=start();show(build(s,s,+$('#len').value*1000));
}
async function goDest(){ // A -> destination avec détours
  const q=$('#q').value.trim();if(!q)return;
  const sum=$('#sum'),vars=$('#vars');vars.innerHTML='';sum.textContent='Recherche...';
  let e;
  try{
    const b=map.getBounds(),vb=[b.getWest(),b.getNorth(),b.getEast(),b.getSouth()].join(',');
    const j=await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=${vb}&q=${encodeURIComponent(q)}`)).json();
    if(!j[0]){sum.textContent='Destination introuvable';return}
    e=[+j[0].lat,+j[0].lon];
  }catch{sum.textContent='Recherche impossible (réseau)';return}
  const s=start(),d0=D(s,e);
  const opts=[[1.15,'COURT'],[1.4,'MOYEN'],[1.8,'LONG']].map(([k,l])=>({l,r:build(s,e,Math.max(d0*k,d0+300))}));
  opts.forEach(o=>{const b=document.createElement('button');
    b.textContent=`${o.l} ${o.r.stops.length}👾 ${(o.r.meters/1000).toFixed(1).replace('.',',')}km`;
    b.onclick=()=>show(o.r);vars.appendChild(b)});
  show(opts[1].r);
}

// ---------- Radar plein écran ----------
let fsOpen=false, sel=null, hits=[], fsCache={t:0,list:[]};
const addrCache=store.get('addr',{});
function near(n){
  if(Date.now()-fsCache.t>1000){fsCache.t=Date.now();
    fsCache.list=pts.filter(p=>!flashed.has(p.id)).map(p=>({p,d:dist(me,p.ll)})).sort((a,b)=>a.d-b.d).slice(0,n)}
  return fsCache.list;
}
function sizeFs(){
  const c=$('#fsr'),h=window.visualViewport?visualViewport.height:innerHeight,dpr=devicePixelRatio||1;
  const sz=Math.max(200,Math.min(innerWidth-16,h-250));
  c.style.width=c.style.height=sz+'px';c.width=c.height=Math.round(sz*dpr);
}
function openFs(){fsOpen=true;sel=null;fsCache.t=0;$('#fs').style.display='flex';sizeFs();
  $('#fsinfo').innerHTML='<span class="dim">Touche un carré bleu pour voir l\'invader.</span>';fsLoop()}
function closeFs(){fsOpen=false;$('#fs').style.display='none'}
function fsLoop(){
  if(!fsOpen)return;
  const c=$('#fsr'),x=c.getContext('2d'),S=c.clientWidth,dpr=c.width/S,cx=S/2,r=S/2-14;
  x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#000';x.fillRect(0,0,S,S);
  x.textAlign='center';x.textBaseline='middle';
  if(!me){x.fillStyle='#fff';x.font='10px monospace';x.fillText('En attente du GPS...',cx,cx);requestAnimationFrame(fsLoop);return}
  const list=near(6),range=Math.max(100,(list.length?list[list.length-1].d:100)*1.15);
  x.strokeStyle='#444';x.lineWidth=2;x.fillStyle='#888';x.font='9px monospace';
  [.25,.5,.75,1].forEach(k=>{x.beginPath();x.arc(cx,cx,r*k,0,7);x.stroke();x.fillText(fmt(range*k),cx+22,cx-r*k+8)});
  x.beginPath();x.moveTo(cx,cx-r);x.lineTo(cx,cx+r);x.moveTo(cx-r,cx);x.lineTo(cx+r,cx);x.stroke();
  angle+=.03;x.strokeStyle='#3d6bff';x.beginPath();x.moveTo(cx,cx);x.lineTo(cx+r*Math.sin(angle),cx-r*Math.cos(angle));x.stroke();
  if(heading!=null){const a=rad(-heading);x.fillStyle='#fff';x.font='bold 12px monospace';x.fillText('N',cx+(r+8)*Math.sin(a),cx-(r+8)*Math.cos(a))}
  x.fillStyle='#fff';x.beginPath();x.moveTo(cx,cx-9);x.lineTo(cx+7,cx+7);x.lineTo(cx-7,cx+7);x.fill();
  hits=[];
  list.forEach((o,i)=>{
    const a=rad(bearing(me,o.p.ll)-(heading||0)),k=Math.min(o.d/range,1)*r,bx=cx+k*Math.sin(a),by=cx-k*Math.cos(a);
    x.fillStyle='#3d6bff';x.fillRect(bx-13,by-13,26,26);
    if(sel&&sel.id===o.p.id){x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(bx-15,by-15,30,30)}
    x.fillStyle='#fff';x.font='bold 13px monospace';x.fillText(i+1,bx,by+1);
    hits.push({x:bx,y:by,p:o.p});
  });
  if(sel){const e=$('#fsd');if(e)e.textContent=fmt(dist(me,sel.ll))}
  requestAnimationFrame(fsLoop);
}
async function getAddr(p){
  if(addrCache[p.id])return addrCache[p.id];
  try{
    const j=await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&addressdetails=1&lat=${p.ll[0]}&lon=${p.ll[1]}`)).json(), a=j.address||{};
    const road=[a.house_number,a.road||a.pedestrian||a.footway||a.path].filter(Boolean).join(' ');
    const city=[a.postcode,a.city||a.town||a.village||a.suburb].filter(Boolean).join(' ');
    const t=[road,city].filter(Boolean).join(', ')||j.display_name;
    if(t){addrCache[p.id]=t;store.set('addr',addrCache)}return t;
  }catch{return null}
}
async function select(p){
  sel=p;const el=$('#fsinfo');
  el.innerHTML=`<div class="big">${esc(p.name)}</div><div>à <span id="fsd">${fmt(dist(me,p.ll))}</span></div><div id="fsa">Adresse...</div>${p.desc?`<div class="dim">${esc(p.desc).slice(0,140)}</div>`:''}`;
  const b=document.createElement('button');b.textContent='FLASHÉ !';b.style.alignSelf='flex-start';
  b.onclick=()=>{flashed.add(p.id);store.set('flashed',[...flashed]);style(p);count();update();sel=null;fsCache.t=0;el.innerHTML='<span class="dim">Marqué comme flashé.</span>'};
  el.appendChild(b);
  const t=await getAddr(p);
  if(sel===p){const a=$('#fsa');if(a)a.textContent=t||'Adresse indisponible (réseau)'}
}
$('#radar').onclick=openFs;
$('#fsx').onclick=closeFs;
$('#fsr').addEventListener('click',e=>{
  const b=e.target.getBoundingClientRect(),px=e.clientX-b.left,py=e.clientY-b.top;let best=null,bd=30;
  hits.forEach(h=>{const d=Math.hypot(h.x-px,h.y-py);if(d<bd){bd=d;best=h.p}});
  if(best)select(best);
});
addEventListener('resize',()=>fsOpen&&sizeFs());
if(window.visualViewport)visualViewport.addEventListener('resize',()=>fsOpen&&sizeFs());

// ---------- Boutons ----------
$('#plan').onclick=plan;
$('#go2').onclick=goDest;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();goDest()}});
const hb=()=>{$('#hide').textContent=hideDone?'AFFICHER FLASHÉS':'MASQUER FLASHÉS';$('#hide').classList.toggle('on',hideDone)};hb();
$('#hide').onclick=()=>{hideDone=!hideDone;store.set('hide',hideDone);hb();pts.forEach(style)};
const norm=n=>n.toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^([A-Z]+)0+(\d)/,'$1$2');
$('#list').onclick=()=>{ // import / export de la liste des invaders flashés (par nom, ex. PA_0123)
  const cur=pts.filter(p=>flashed.has(p.id)).map(p=>p.name).join(', ');
  const v=prompt('Liste des invaders flashés (noms séparés par des virgules). Colle la tienne pour importer :',cur);
  if(v===null)return;
  const want=new Set(v.split(/[\s,;]+/).filter(Boolean).map(norm));
  flashed=new Set(pts.filter(p=>want.has(norm(p.name))).map(p=>p.id));
  store.set('flashed',[...flashed]);pts.forEach(style);count();update();
};
$('#ctr').onclick=()=>{if(follow){follow=false;setFollowBtn()}else enterFollow()};
$('#ov').onclick=()=>{follow=false;setFollowBtn();routeBounds&&map.fitBounds(routeBounds,{padding:[30,30]})};
$('#alert').onclick=e=>{const v=[50,100,0];alertM=v[(v.indexOf(alertM)+1)%3];alertOn=alertM>0;
  e.target.textContent=alertOn?`ALERTE ${alertM}m`:'ALERTE OFF';e.target.classList.toggle('on',alertOn)};
$('#go').onclick=async()=>{
  if(!navigator.geolocation){$('#err').textContent='Géolocalisation indisponible';return}
  try{if(DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch{}
  addEventListener('deviceorientation',e=>{heading=e.webkitCompassHeading??(e.alpha!=null?360-e.alpha:null)});
  try{if('serviceWorker' in navigator)swReg=await navigator.serviceWorker.register('sw.js')}catch{}
  try{if('Notification' in window)await Notification.requestPermission()}catch{}
  try{await navigator.wakeLock?.request('screen')}catch{}
  navigator.geolocation.watchPosition(onPos,e=>{$('#nm').textContent='GPS: '+e.message},{enableHighAccuracy:true,maximumAge:2000});
  $('#start').style.display='none';
};
</script>
</body>
